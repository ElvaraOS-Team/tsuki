name: Build Release
on:
  push:
    tags:
      - v*
    branches:
       - test-release/*

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${ref##test-release/}" >> $GITHUB_OUTPUT
        env:
          ref: ${{ github.ref_name }}

  build-releases:
    name: Build release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
        - docker: amd64
          arch: x86_64
        - docker: arm64/v8
          arch: aarch64
        - docker: arm/v7
          arch: armv7h

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true
      - run: docker build --platform=linux/${{ matrix.platform.docker }} -o . .
      - uses: actions/upload-artifact@v3
        with:
          name: pinky-${{ matrix.platform.arch }}
          path: pinky.tar.zst

  release:
    name: Create GitHub Release and Upload Binaries
    runs-on: ubuntu-latest
    needs: [build-releases, get-version]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts with version and arch
        run: |
          version="${{ needs.get-version.outputs.version }}"
          mkdir -p upload
          for dir in artifacts/*/; do
            arch="$(basename "$dir")"
            suffix="${arch#pinky-}"
            cp "$dir/pinky.tar.zst" "upload/pinky-${version}-${suffix}.tar.zst"
          done

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Pinky v${{ needs.get-version.outputs.version }}
          body_path: CHANGELOG.md
          files: upload/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

